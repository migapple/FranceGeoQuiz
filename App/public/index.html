<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>France Quiz — Régions &amp; Départements</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#0d1117;--surface:#161b22;--card:#1c2333;--gold:#d4a843;--gold2:#f0c96a;--green:#22c55e;--red:#ef4444;--text:#e6edf3;--muted:#7d8590;--border:#30363d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:Georgia,serif}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg)}
.header{padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:9px;padding-left:16px;padding-right:16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.hdr-title{font-size:16px;color:var(--gold);font-weight:bold}
.hdr-sub{font-size:11px;color:var(--muted);margin-top:2px}
.score-wrap{display:flex;gap:8px}
.sbox{text-align:center}
.snum{font-size:20px;font-weight:bold;line-height:1}
.slbl{font-size:8px;color:var(--muted);margin-top:1px}
.ok .snum, .snum.ok{color:var(--green)}.snum.ok2{color:#f0c96a}.snum.ok3{color:#4d908e}
.phase-bar{display:flex;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.ps{flex:1;padding:7px 4px;text-align:center;font-size:10px;color:var(--muted);border:none;border-bottom:2px solid transparent;line-height:1.4;background:none;cursor:pointer;font-family:Georgia,serif}
.ps.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:bold}
.prog-wrap{height:3px;background:var(--border);flex-shrink:0}
.prog-fill{height:100%;background:var(--gold);transition:width .4s}
.q-banner{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;flex-shrink:0;min-height:48px;display:flex;align-items:center;justify-content:center}
.q-text{font-size:14px;color:var(--text);text-align:center;line-height:1.5}
.q-hl{color:var(--gold2);font-weight:bold}
.q-ctx{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.map-wrap{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}
.leaflet-container{background:#e8e4dc!important}
.leaflet-interactive{pointer-events:auto!important}
.leaflet-overlay-pane svg path{pointer-events:visiblePainted!important}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{font-size:8px;opacity:.2;background:rgba(0,0,0,.6)!important;color:#888!important}
.fb-bar{background:var(--surface);border-top:1px solid var(--border);padding:11px 14px;padding-bottom:calc(11px + env(safe-area-inset-bottom));flex-shrink:0;text-align:center;font-size:12px;color:var(--muted);min-height:52px;display:flex;align-items:center;justify-content:center;line-height:1.5}
.fb-bar.ok{color:var(--green)}.fb-bar.ko{color:var(--red)}.fb-bar.hint{color:var(--gold)}
.pm{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;border:2px solid rgba(255,255,255,.4);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pm.idle{background:rgba(59,130,246,.85)}.pm.done{background:rgba(80,80,80,.7)}.pm.ok{background:rgba(34,197,94,.9);border-color:#86efac}.pm.ko{background:rgba(239,68,68,.9);border-color:#fca5a5}
.ov{position:absolute;inset:0;background:rgba(13,17,23,.93);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:2000;gap:14px;padding:32px;text-align:center}
.ov.show{display:flex}
.ov-emoji{font-size:52px}.ov-title{font-size:21px;color:var(--gold2);font-weight:bold}.ov-reg{font-size:13px;color:var(--gold)}.ov-msg{font-size:14px;color:var(--text);line-height:1.6;max-width:280px}
.ov-btn{background:var(--gold);color:#0d1117;border:none;border-radius:22px;padding:12px 32px;font-size:15px;font-weight:bold;cursor:pointer;font-family:Georgia,serif;margin-top:6px}
.rsel{position:absolute;inset:0;background:rgba(13,17,23,.97);z-index:3000;display:flex;flex-direction:column;padding:16px;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.rsel-title{font-size:14px;color:var(--gold2);font-weight:bold;margin-bottom:12px;text-align:center;flex-shrink:0}
.rsel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rsel-btn{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:12px 8px;font-size:12px;color:var(--text);cursor:pointer;font-family:Georgia,serif;line-height:1.3;text-align:center}
.rsel-cancel{margin-top:12px;background:none;border:1px solid var(--border);border-radius:20px;padding:10px 24px;font-size:13px;color:var(--muted);cursor:pointer;font-family:Georgia,serif;flex-shrink:0;align-self:center}
.r-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);width:100%;max-width:280px}
.load-ov{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4000;gap:14px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:13px;color:var(--muted)}
</style>
</head>

    <div style="display:flex;gap:6px;align-items:center">
      <button onclick="raz()" style="font-size:10px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:10px;padding:4px 8px;cursor:pointer;font-family:Georgia,serif">RAZ</button>

  <div class="q-banner"><div class="q-text" id="q-text">Chargement…</div></div>
  <div class="map-wrap">

    <div class="load-ov" id="load-ov"><div class="spinner"></div><div class="load-txt">Chargement…</div></div>

</div>

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',maxZoom:13}).addTo(map);
  map.setView([46.5,2.3],5);
  initTouch();
  try{
    const [a,b]=await Promise.all([
      fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/regions-version-simplifiee.geojson'),
      fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson')
    ]);
    [rGeo,dGeo]=await Promise.all([a.json(),b.json()]);
    rGeo.features=rGeo.features.filter(f=>REGIONS.some(r=>r.code===f.properties.code));
    dGeo.features=dGeo.features.filter(f=>DEPTS.some(d=>d.code===f.properties.code));
    document.getElementById('load-ov').style.display='none';
    jumpToPhase(1);
  }catch(e){
    document.getElementById('load-ov').innerHTML='<div style="color:#ef4444;text-align:center;padding:32px">Erreur de chargement.<br>Vérifiez votre connexion.</div>';

// ===== TOUCH HANDLER (Safari fix) =====
function initTouch(){
  const c=map.getContainer();
  c.addEventListener('touchstart',e=>{if(e.touches.length){_touchSX=e.touches[0].clientX;_touchSY=e.touches[0].clientY;}},{passive:true});
  c.addEventListener('touchend',e=>{
    if(!e.changedTouches.length)return;
    const t=e.changedTouches[0];
    if(Math.abs(t.clientX-_touchSX)>10||Math.abs(t.clientY-_touchSY)>10)return;
    const rect=c.getBoundingClientRect();
    const ll=map.containerPointToLatLng([t.clientX-rect.left,t.clientY-rect.top]);
    if(!gLayer||!_geoClickFn)return;
    let hit=false;
    gLayer.eachLayer(l=>{
      if(hit||!l.feature)return;
      try{if(l.getBounds().contains(ll)&&ptInLayer(ll,l)){hit=true;_geoClickFn(l.feature.properties.code);}}catch(e){}
    });
  },{passive:true});
}
function ptInLayer(ll,l){
  const g=l.feature.geometry,pt=[ll.lng,ll.lat];
  const polys=g.type==='MultiPolygon'?g.coordinates:g.type==='Polygon'?[g.coordinates]:[];
  return polys.some(p=>ptInRing(pt,p[0]));
}
function ptInRing(pt,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>pt[1])!==(yj>pt[1]))&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)inside=!inside;
  }
  return inside;
}

// ===== LAYER =====
function buildLayer(geoData, clickFn, styleFn){
  if(gLayer){gLayer.remove();gLayer=null;}
  _geoClickFn=clickFn;
  gLayer=L.geoJSON(geoData,{
    style:f=>styleFn(f.properties.code),
    onEachFeature:(f,l)=>l.on('click',e=>{L.DomEvent.stop(e);clickFn(f.properties.code);})
  }).addTo(map);
}
function setS(code,s){gLayer&&gLayer.eachLayer(l=>{if(l.feature.properties.code===code)l.setStyle(s);});}
function fitAll(){map.setView([46.8,2.3],5.5);}

const sOK={fillColor:'#22c55e',fillOpacity:.82,color:'#86efac',weight:3,opacity:1};
const sKO={fillColor:'#ef4444',fillOpacity:.72,color:'#fca5a5',weight:3,opacity:1};
function srR(c){const col=rInfo(c).color;const f=found.has(c);return{fillColor:col,fillOpacity:f?.55:.38,color:'#fff',weight:f?2:1.5,opacity:.6};}
function srD(c){const col=dCol(c);const f=found.has(c);return{fillColor:col,fillOpacity:f?.55:.38,color:'#fff',weight:f?2:1,opacity:.55};}

// ===== PHASE SWITCH =====
function jumpToPhase(p){
  phase=p; used=[]; found=new Set(); answered=false; clearMarkers();
  scores[p]={ok:0,ko:0};
  document.getElementById('sc'+p).textContent='0✓ 0✗';
  document.getElementById('res-ov').classList.remove('show');
  [1,2,3].forEach(n=>{document.getElementById('ps'+n).classList.remove('active');});
  document.getElementById('ps'+p).classList.add('active');
  const subs=['','Régions','Départements','Chefs-lieux'];
  document.getElementById('hdr-sub').textContent=subs[p];

  if(p===1){
    buildLayer(rGeo,clickR,srR);
    fitAll();
    nextQ();
  } else if(p===2){
    buildLayer(dGeo,clickD,srD);
    fitAll();
    nextQ();
  } else {
    // Phase 3 : layer dept non interactif + marqueurs
    if(gLayer){gLayer.remove();gLayer=null;}_geoClickFn=null;
    gLayer=L.geoJSON(dGeo,{style:f=>srD(f.properties.code)}).addTo(map);
    fitAll();
    buildMarkers();
    nextQ();
  }
  document.getElementById('prog').style.width='0%';
}

// ===== QUESTIONS =====
function nextQ(){
  answered=false;
  fb('hint','Tapez sur la bonne zone');
  const dataset=phase===1?REGIONS:DEPTS;
  const total=dataset.length;
  if(used.length>=total){used=[];found=new Set();if(phase===3)buildMarkers();}
  const rem=dataset.filter(x=>!used.includes(x.code));
  cur=rem[Math.floor(Math.random()*rem.length)];
  used.push(cur.code);
  document.getElementById('prog').style.width=(used.length/total*100)+'%';

  if(phase===1){
    qt('Où se trouve <span class="q-hl">'+cur.name+'</span> ?');
    fb('hint','Tapez sur la bonne région');
  } else if(phase===2){
    qt('Où se trouve <span class="q-hl">'+cur.name+'</span> ?<span class="q-ctx">n°'+cur.code+' — '+rInfo(cur.region).name+'</span>');
    fb('hint','Tapez sur le bon département');
  } else {
    updateMarkers();
    qt('Où se trouve <span class="q-hl">'+PREFS[cur.code]+'</span> ?<span class="q-ctx">Préfecture du '+cur.name+' ('+cur.code+')</span>');
    fb('hint','Tapez sur le marqueur 📍 correspondant');
  }
}

// ===== CLICS =====
function clickR(code){
  if(answered)return; answered=true;
  if(code===cur.code){
    setS(code,sOK); found.add(code);
    fb('ok','✓ '+cur.name); scores[1].ok++;
  } else {
    setS(code,sKO); setS(cur.code,sOK); found.add(cur.code);
    fb('ko','✗ '+rInfo(code).name+' — '+cur.name); scores[1].ko++;
  }
  document.getElementById('sc1').textContent=scores[1].ok+'✓ '+scores[1].ko+'✗';
  setTimeout(nextQ,1200);
}

function clickD(code){
  if(answered)return; answered=true;
  if(code===cur.code){
    setS(code,sOK); found.add(code);
    fb('ok','✓ '+cur.name+' ('+cur.code+')'); scores[2].ok++;
  } else {
    setS(code,sKO); setS(cur.code,sOK); found.add(cur.code);
    fb('ko','✗ '+dInfo(code).name+' — '+cur.name+' ('+cur.code+')'); scores[2].ko++;
  }
  document.getElementById('sc2').textContent=scores[2].ok+'✓ '+scores[2].ko+'✗';
  setTimeout(nextQ,1200);
}

function clickP(code){
  if(answered)return; answered=true;
  if(code===cur.code){
    setMarkerCls(code,'ok'); found.add(code);
    fb('ok','✓ '+PREFS[code]+' — '+cur.name); scores[3].ok++;
  } else {
    setMarkerCls(code,'ko'); setMarkerCls(cur.code,'ok'); found.add(cur.code);
    fb('ko','✗ '+PREFS[code]+' — Réponse : '+PREFS[cur.code]); scores[3].ko++;
  }
  document.getElementById('sc3').textContent=scores[3].ok+'✓ '+scores[3].ko+'✗';
  setTimeout(nextQ,1200);
}

// ===== MARQUEURS =====
function buildMarkers(){
  clearMarkers();
  DEPTS.forEach(d=>{
    const m=L.marker([d.lat,d.lng],{
      icon:L.divIcon({className:'',html:'<div class="pm idle" id="pm-'+d.code+'">📍</div>',iconSize:[32,32],iconAnchor:[16,16]}),
      interactive:true,bubblingMouseEvents:false,zIndexOffset:500
    }).addTo(map);
    m.on('click',e=>{L.DomEvent.stop(e);clickP(d.code);});
    m._dc=d.code;
    markers.push(m);
  });
}
function updateMarkers(){
  markers.forEach(m=>{
    const el=document.getElementById('pm-'+m._dc);
    if(el)el.className='pm '+(found.has(m._dc)?'done':'idle');
  });
}
function setMarkerCls(code,cls){const el=document.getElementById('pm-'+code);if(el)el.className='pm '+cls;}
function clearMarkers(){markers.forEach(m=>m.remove());markers=[];}
